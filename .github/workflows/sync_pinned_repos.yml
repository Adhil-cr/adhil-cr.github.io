name: Sync Pinned Repositories

on:
  schedule:
    # Run automatically every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows 1-click manual sync in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-pinned:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape & Sync Pinned Repositories
        run: |
          python3 .github/scripts/sync_pinned_repos.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pinned_repos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-sync live GitHub pinned repositories [skip ci]"
            git push
          else
            echo "No changes in pinned repositories."
          fi
